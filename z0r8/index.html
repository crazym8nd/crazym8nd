<!DOCTYPE html>

<title>z0r.de/8 — the worm</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    color: #fff;
  }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { text-decoration: underline; }
  .stage {
    position: relative;
    width: 550px;
    max-width: 100%;
    aspect-ratio: 550 / 400;
    background: #000;
    border: 1px solid #222;
    border-radius: 6px;
    overflow: hidden;
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #playBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 14px 28px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.15s ease, background 0.15s ease;
    z-index: 2;
  }
  #playBtn:hover { transform: translate(-50%, -50%) scale(1.05); background: rgba(0,0,0,0.8); }
  #playBtn:active { transform: translate(-50%, -50%) scale(0.97); }
  #playBtn .icon { font-size: 1.2rem; }
  .hint {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #888;
  }
  .credits {
    margin-top: 32px;
    max-width: 560px;
    font-size: 0.78rem;
    line-height: 1.6;
    color: #666;
    text-align: center;
  }
  .credits a { color: #999; }
  .credits a:hover { color: #ccc; }
</style>
</head>
<body>
  <h1><a href="https://z0r.de/8" target="_blank" rel="noopener">z0r.de/8</a></h1>

  <div class="stage">
    <video id="video" src="z0r8.mp4" poster="../z0r8.gif" loop playsinline autoplay muted preload="auto"></video>
    <button id="playBtn" aria-label="Play with music"><span class="icon">&#128266;</span> Play with music</button>
  </div>

  <p class="hint">The animation plays silently. Click to enable the original soundtrack.</p>

  <div class="credits">

    <p>Played with <a href="https://xmplay.com/" target="_blank" rel="noopener">XMPlay</a> +
       <a href="https://support.xmplay.com/files_view.php?file_id=547" target="_blank" rel="noopener">Neutron skin</a>.</p>
    <p>Rendered with <a href="https://ruffle.rs/" target="_blank" rel="noopener">Ruffle</a>.</p>
  </div>

  <script>
    const btn = document.getElementById('playBtn');
    const video = document.getElementById('video');

    btn.addEventListener('click', () => {
      video.muted = false;
      video.play().catch(() => {});
      btn.style.display = 'none';
    });
  </script>
</body>
