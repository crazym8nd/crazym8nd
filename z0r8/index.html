<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><circle cx='8' cy='8' r='4' fill='%23ffd700'/></svg>">
<title>z0r.de/8 — the worm</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    width: 550px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .back-link {
    align-self: flex-start;
    margin-bottom: 16px;
    color: #999;
    text-decoration: none;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: #fff; }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    color: #fff;
  }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { text-decoration: underline; }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 550 / 400;
    background: #000;
    border: 1px solid #222;
    border-radius: 6px;
    overflow: hidden;
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    width: 100%;
  }
  #muteBtn {
    flex-shrink: 0;
    width: 44px;
    height: 36px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    color: #fff;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #muteBtn:hover { border-color: #666; background: #1a1a1a; }
  .volume-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  #volume {
    flex: 1;
    accent-color: #ffd700;
    cursor: pointer;
  }
  .vol-label {
    font-size: 0.8rem;
    color: #888;
    min-width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #888;
  }
  .credits {
    margin-top: 32px;
    font-size: 0.78rem;
    line-height: 1.6;
    color: #666;
    text-align: center;
  }
  .credits a { color: #999; }
  .credits a:hover { color: #ccc; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="https://github.com/crazym8nd">← Back to profile</a>

    <h1><a href="https://z0r.de/8" target="_blank" rel="noopener">z0r.de/8</a></h1>

    <div class="stage">
      <video id="video" src="z0r8.mp4" poster="../z0r8.gif" loop playsinline autoplay muted preload="auto"></video>
    </div>

    <div class="controls">
      <button id="muteBtn" aria-label="Mute / unmute">🔇</button>
      <div class="volume-wrap">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.2" aria-label="Volume">
        <span class="vol-label" id="volLabel">20%</span>
      </div>
    </div>

    <p class="hint">The animation plays immediately. Click the speaker to enable sound at low volume.</p>

    <div class="credits">
      <p>Original animation: <a href="https://z0r.de/8" target="_blank" rel="noopener">z0r.de/8</a> (2001, Flash 5).</p>
      <p>Music: Aspartame — <a href="http://www.maf464.com/" target="_blank" rel="noopener">maf464.com</a> ·
         <a href="https://modarchive.org/index.php?request=view_by_moduleid&query=34115" target="_blank" rel="noopener">ModArchive #34115</a> ·
         <a href="https://www.youtube.com/watch?v=NvtG1XrEjUI" target="_blank" rel="noopener">YouTube</a></p>
      <p>Played with <a href="https://xmplay.com/" target="_blank" rel="noopener">XMPlay</a> +
         <a href="https://support.xmplay.com/files_view.php?file_id=547" target="_blank" rel="noopener">Neutron skin</a>.</p>
      <p>Rendered with <a href="https://ruffle.rs/" target="_blank" rel="noopener">Ruffle</a>.</p>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const muteBtn = document.getElementById('muteBtn');
    const volume = document.getElementById('volume');
    const volLabel = document.getElementById('volLabel');

    // Browsers block autoplay with sound — the video starts muted at low
    // volume; one click on the speaker (or moving the slider) enables sound.
    video.volume = 0.2;

    function update() {
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
      volLabel.textContent = Math.round(video.volume * 100) + '%';
    }

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (!video.muted) video.play().catch(() => {});
      update();
    });

    volume.addEventListener('input', () => {
      video.volume = parseFloat(volume.value);
      if (video.volume > 0 && video.muted) {
        video.muted = false;
        video.play().catch(() => {});
      }
      update();
    });

    video.addEventListener('volumechange', update);
    update();
  </script>
</body>
</html>
