<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><circle cx='8' cy='8' r='4' fill='%23ffd700'/></svg>">
<title>z0r.de/8 — the worm</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    width: 550px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .back-link {
    align-self: flex-start;
    margin-bottom: 16px;
    color: #999;
    text-decoration: none;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: #fff; }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 550 / 400;
    background: #000;
    border: 1px solid #222;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  .sound-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding: 4px 10px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 150ms ease-in;
    pointer-events: none;
    z-index: 2;
  }
  #volume {
    position: absolute;
    right: 12px;
    bottom: 38px;
    width: 82px;
    height: 22px;
    accent-color: #ffd700;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease-in;
    z-index: 2;
  }
  .stage:hover .sound-badge,
  .stage:focus-within .sound-badge { opacity: 1; transition-timing-function: ease-out; }
  .stage:hover #volume,
  .stage:focus-within #volume { opacity: 1; pointer-events: auto; transition-timing-function: ease-out; }
  #volume:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
  }
  .stage:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 3px;
  }
  .credits {
    margin-top: 24px;
    font-size: 0.75rem;
    line-height: 1.6;
    color: #555;
    text-align: center;
  }
  .credits a { color: #888; }
  .credits a:hover { color: #bbb; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="https://github.com/crazym8nd">← Back to profile</a>

    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Enable sound" title="Click to toggle sound">
      <video id="video" src="z0r8.mp4" poster="../z0r8.gif" loop playsinline autoplay muted preload="auto"></video>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.2" aria-label="Volume">
      <div class="sound-badge" id="soundBadge">Sound OFF</div>
    </div>

    <div class="credits">
      <p>Original animation: <a href="https://z0r.de/8" target="_blank" rel="noopener">z0r.de/8</a> (2001, Flash 5).</p>
      <p>Music: Aspartame — <a href="http://www.maf464.com/" target="_blank" rel="noopener">maf464.com</a> ·
         <a href="https://modarchive.org/index.php?request=view_by_moduleid&query=34115" target="_blank" rel="noopener">ModArchive #34115</a> ·
         <a href="https://www.youtube.com/watch?v=NvtG1XrEjUI" target="_blank" rel="noopener">YouTube</a></p>
      <p>Played with <a href="https://xmplay.com/" target="_blank" rel="noopener">XMPlay</a> +
         <a href="https://support.xmplay.com/files_view.php?file_id=547" target="_blank" rel="noopener">Neutron skin</a>.</p>
      <p>Rendered with <a href="https://ruffle.rs/" target="_blank" rel="noopener">Ruffle</a>.</p>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('video');
    const badge = document.getElementById('soundBadge');
    const volume = document.getElementById('volume');

    // Browsers block autoplay with sound — start muted at low volume;
    // clicking the animation toggles the sound (user gesture).
    video.volume = 0.2;

    function update() {
      const isMuted = video.muted;
      badge.textContent = isMuted ? 'Sound OFF' : 'Sound ON';
      stage.setAttribute('aria-label', isMuted ? 'Enable sound' : 'Mute sound');
    }

    function toggleSound() {
      video.muted = !video.muted;
      if (!video.muted) video.play().catch(() => {});
      update();
    }

    stage.addEventListener('click', toggleSound);
    volume.addEventListener('click', (event) => event.stopPropagation());
    volume.addEventListener('input', (event) => {
      video.volume = Number(event.target.value);
      if (video.volume > 0 && video.muted) {
        video.muted = false;
        video.play().catch(() => {});
      }
      update();
    });
    stage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleSound();
      }
    });

    video.addEventListener('volumechange', update);
    update();
  </script>
</body>
</html>
